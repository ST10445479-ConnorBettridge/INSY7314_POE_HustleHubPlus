<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4bc0c8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c779d0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="850" fill="#f8f9fa" rx="10"/>

  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">HustleHub+ - System Architecture (Full-Stack MERN)</text>
  <line x1="100" y1="50" x2="900" y2="50" stroke="#ddd" stroke-width="1"/>

  <!-- ====== CLIENT LAYER ====== -->
  <rect x="150" y="70" width="700" height="95" rx="8" fill="url(#clientGrad)" opacity="0.95"/>
  <text x="500" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="white">CLIENT LAYER</text>

  <rect x="170" y="102" width="200" height="52" rx="6" fill="white" opacity="0.25"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="white">React Web SPA (Vite)</text>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Part 2 - implemented</text>

  <rect x="400" y="102" width="200" height="52" rx="6" fill="white" opacity="0.25"/>
  <text x="500" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Android Client (Kotlin)</text>
  <text x="500" y="142" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Part 1 - cert pinned</text>

  <rect x="630" y="102" width="200" height="52" rx="6" fill="white" opacity="0.25"/>
  <text x="730" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Postman / Newman</text>
  <text x="730" y="142" text-anchor="middle" font-size="10" fill="white" opacity="0.9">API test suite</text>

  <line x1="270" y1="165" x2="270" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="165" x2="500" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="165" x2="730" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="205" text-anchor="middle" font-size="10" fill="#666">HTTPS (TLS 1.2 or newer, self-signed dev cert)</text>

  <!-- ====== SYSTEM BOUNDARY ====== -->
  <rect x="50" y="230" width="900" height="480" rx="12" fill="none" stroke="#2c3e50" stroke-width="2.5" stroke-dasharray="8,4"/>
  <rect x="50" y="230" width="200" height="28" rx="6" fill="#2c3e50"/>
  <text x="150" y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="white">SYSTEM BOUNDARY</text>

  <!-- ====== EXPRESS API SERVER ====== -->
  <rect x="100" y="275" width="800" height="170" rx="10" fill="url(#serverGrad)" opacity="0.9"/>
  <text x="500" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="white">EXPRESS API SERVER (Node.js)</text>

  <rect x="110" y="315" width="160" height="50" rx="6" fill="white" opacity="0.25"/>
  <text x="190" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Auth Routes</text>
  <text x="190" y="354" text-anchor="middle" font-size="10" fill="white" opacity="0.9">register / login / profile</text>

  <rect x="290" y="315" width="160" height="50" rx="6" fill="white" opacity="0.25"/>
  <text x="370" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Gig Routes</text>
  <text x="370" y="354" text-anchor="middle" font-size="10" fill="white" opacity="0.9">list / create / edit / delete</text>

  <rect x="470" y="315" width="160" height="50" rx="6" fill="white" opacity="0.25"/>
  <text x="550" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Booking Routes</text>
  <text x="550" y="354" text-anchor="middle" font-size="10" fill="white" opacity="0.9">book + auto transaction</text>

  <rect x="650" y="315" width="150" height="50" rx="6" fill="white" opacity="0.25"/>
  <text x="725" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Income Routes</text>
  <text x="725" y="354" text-anchor="middle" font-size="10" fill="white" opacity="0.9">earnings + tax estimate</text>

  <text x="500" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="white" opacity="0.9">MIDDLEWARE PIPELINE</text>
  <rect x="120" y="400" width="125" height="30" rx="5" fill="white" opacity="0.2"/>
  <text x="182" y="420" text-anchor="middle" font-size="10" fill="white">Auth (JWT Verify)</text>
  <rect x="255" y="400" width="125" height="30" rx="5" fill="white" opacity="0.2"/>
  <text x="317" y="420" text-anchor="middle" font-size="10" fill="white">Validation</text>
  <rect x="390" y="400" width="150" height="30" rx="5" fill="white" opacity="0.2"/>
  <text x="465" y="420" text-anchor="middle" font-size="10" fill="white">Sanitise (NoSQL/XSS)</text>
  <rect x="550" y="400" width="125" height="30" rx="5" fill="white" opacity="0.2"/>
  <text x="612" y="420" text-anchor="middle" font-size="10" fill="white">Error Handler</text>
  <rect x="685" y="400" width="125" height="30" rx="5" fill="white" opacity="0.2"/>
  <text x="747" y="420" text-anchor="middle" font-size="10" fill="white">Logger (Winston)</text>

  <line x1="500" y1="445" x2="500" y2="495" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== SECURITY LAYER ====== -->
  <rect x="100" y="500" width="800" height="80" rx="10" fill="url(#securityGrad)" opacity="0.9"/>
  <text x="500" y="523" text-anchor="middle" font-size="14" font-weight="bold" fill="white">SECURITY CONTROLS</text>

  <rect x="120" y="535" width="125" height="30" rx="5" fill="white" opacity="0.25"/>
  <text x="182" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Helmet (Headers)</text>

  <rect x="255" y="535" width="125" height="30" rx="5" fill="white" opacity="0.25"/>
  <text x="317" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Rate Limiting</text>

  <rect x="390" y="535" width="125" height="30" rx="5" fill="white" opacity="0.25"/>
  <text x="452" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="white">HTTPS / TLS</text>

  <rect x="525" y="535" width="175" height="30" rx="5" fill="white" opacity="0.25"/>
  <text x="612" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="white">XSS + NoSQL Injection defence</text>

  <rect x="710" y="535" width="125" height="30" rx="5" fill="white" opacity="0.25"/>
  <text x="772" y="555" text-anchor="middle" font-size="10" font-weight="bold" fill="white">CORS</text>

  <line x1="500" y1="580" x2="500" y2="625" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ====== DATA LAYER ====== -->
  <rect x="100" y="630" width="800" height="65" rx="10" fill="url(#dataGrad)" opacity="0.9"/>
  <text x="500" y="653" text-anchor="middle" font-size="14" font-weight="bold" fill="white">DATA LAYER</text>

  <rect x="150" y="663" width="300" height="25" rx="4" fill="white" opacity="0.25"/>
  <text x="300" y="681" text-anchor="middle" font-size="10" font-weight="bold" fill="white">MongoDB (Mongoose) - in-memory dev / MONGODB_URI</text>

  <rect x="470" y="663" width="300" height="25" rx="4" fill="white" opacity="0.25"/>
  <text x="620" y="681" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Users, Gigs, Bookings, Transactions</text>

  <rect x="790" y="663" width="90" height="25" rx="4" fill="white" opacity="0.25"/>
  <text x="835" y="681" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Log Files</text>

  <!-- Legend -->
  <rect x="50" y="735" width="900" height="95" rx="8" fill="#eef2f7"/>
  <text x="500" y="755" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Layers</text>

  <rect x="80" y="768" width="15" height="15" rx="3" fill="#667eea"/>
  <text x="100" y="780" font-size="10" fill="#333">Client Layer</text>

  <rect x="250" y="768" width="15" height="15" rx="3" fill="#4facfe"/>
  <text x="270" y="780" font-size="10" fill="#333">API Layer</text>

  <rect x="420" y="768" width="15" height="15" rx="3" fill="#f5576c"/>
  <text x="440" y="780" font-size="10" fill="#333">Security Layer</text>

  <rect x="580" y="768" width="15" height="15" rx="3" fill="#4bc0c8"/>
  <text x="600" y="780" font-size="10" fill="#333">Data Layer</text>

  <text x="500" y="812" text-anchor="middle" font-size="9" fill="#888">Stack: Node.js | Express | MongoDB (Mongoose) | React (Vite + Router) | bcrypt | JWT | Helmet | express-rate-limit | express-validator | express-mongo-sanitize | xss | Winston | HTTPS/TLS | Jest | Vitest | Newman</text>
</svg>